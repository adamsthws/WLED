# PlatformIO Project Configuration Override
# ------------------------------------------------------------------------------
# Please visit documentation: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = seengreat_hub75_matrix_s3

; USERMODS NOTE: since the 'dynarray_multi' usermod refactor, a usermod is only compiled
; if its folder name is listed in custom_usermods (space-separated) for the env -
; the old "-D USERMOD_X" flags no longer include the usermod on their own, they now
; only configure it once its folder has been added to custom_usermods below.

; Convoy M21A flashlight controller
[env:esp32c3_xiao_flashlight]
extends = env:esp32c3dev
custom_usermods =
  ${env:esp32c3dev.custom_usermods} ; Include original ESP32-C3 usermods from platformio.ini file
  Battery                           ; Battery voltage monitoring
  Internal_Temperature              ; Internal temperature sensor
build_flags =
  ${env:esp32c3dev.build_flags}                ; Include original ESP32-C3 build flags from platformio.ini file
  -D USERMOD_BATTERY_MEASUREMENT_PIN=5         ; Custom GPIO pin for battery voltage measurement
  -D USERMOD_BATTERY_MEASUREMENT_INTERVAL=3000 ; Measure battery every x seconds
  -D USERMOD_BATTERY_DEFAULT_TYPE=2            ; Default battery type: Li-ion
  -D ABL_MILLIAMPS_DEFAULT=0                   ; Set milliampere limit when using ESP pin to power LEDs. (0=disabled)
  -D WLED_PWM_FREQ=2020                        ; Matches the Convoy M21A's original driver, measured by probing its PWM signal
                                               ;   (defaults to 880 on esp8266 and 19531 on esp32)
  -D LEDPIN=6                                  ; Set default LED pin
  -D DEFAULT_LED_COUNT=1                       ; Set default LED count

; Millie's Purple Board
[env:esp32c3_lolin_lipo]
extends = env:esp32c3dev
custom_usermods =
  ${env:esp32c3dev.custom_usermods} ; Include original ESP32-C3 usermods
  Battery                           ; Battery voltage monitoring
  Internal_Temperature              ; Internal temperature sensor
build_flags =
  ${env:esp32c3dev.build_flags}                ; Include original ESP32-C3 build flags
  -D USERMOD_BATTERY_MEASUREMENT_PIN=3         ; Set custom GPIO pin for battery voltage measurement
  -D USERMOD_BATTERY_MEASUREMENT_INTERVAL=3000 ; Measure battery every x seconds
  -D USERMOD_BATTERY_DEFAULT_TYPE=1            ; Default battery type: LiPo

; Millie's Purple Board
[env:esp32c3_lolin_li-ion]
extends = env:esp32c3dev
custom_usermods =
  ${env:esp32c3dev.custom_usermods} ; Include original ESP32-C3 usermods
  Battery                           ; Battery voltage monitoring
  Internal_Temperature              ; Internal temperature sensor
build_flags =
  ${env:esp32c3dev.build_flags}                ; Include original ESP32-C3 build flags
  -D USERMOD_BATTERY_MEASUREMENT_PIN=3         ; Set custom GPIO pin for battery voltage measurement
  -D USERMOD_BATTERY_MEASUREMENT_INTERVAL=3000 ; Measure battery every x seconds
  -D USERMOD_BATTERY_DEFAULT_TYPE=2            ; Default battery type: Li-ion

; Pete The Pigeon
[env:esp32_pete]
extends = env:esp32dev
custom_usermods =
  ${env:esp32dev.custom_usermods} ; Include original ESP32 usermods
  Conditional_Triggering          ; Trigger effects based on external conditions
  Battery                         ; Battery voltage monitoring
  Internal_Temperature            ; Internal temperature sensor
  multi_relay                     ; Control multiple relays
build_flags =
  ${env:esp32dev.build_flags}                  ; Include original ESP32 build flags
  -D USERMOD_BATTERY_MEASUREMENT_INTERVAL=3000 ; Measure battery every x seconds
  -D USERMOD_BATTERY_DEFAULT_TYPE=2            ; Default battery type: Li-ion
  -D MULTI_RELAY_MAX_RELAYS=8                  ; Default is 4, max is 8
  -D WLED_LONG_PRESS=2000                      ; Default is 600ms
  -D WLED_DOUBLE_PRESS=1000                    ; Default is 350ms

; Seengreat RGB Matrix HUB75 S3 (SKU: 260612) - https://seengreat.com/wiki/214/
; ESP32-S3-WROOM-1-N16R8: 16MB flash, 8MB octal PSRAM.
; Pinout is board-specific and NOT compatible with the existing SEENGREAT_V1/V2_S3_PINOUT
; options (those are for a different Seengreat devkit+adapter board).
; For now this only wires up the HUB75 panel; SD card, mic, thumb wheel etc are not implemented yet.
[env:seengreat_hub75_matrix_s3]
extends = env:esp32s3dev_16MB_opi
build_unflags = ${esp32s3.build_unflags}
                ${Speed_Flags.build_unflags}    ;; drop "-Os" so it can be overridden with "-O2" below
build_flags = ${common.build_flags} ${esp32s3.build_flags} ${hub75.build_flags} ${hub75.s3_build_flags} ${hub75.i2s_disable_flags}
  ${Speed_Flags.build_flags}                    ;; -O2 -> optimize for speed instead of size
  -D WLED_RELEASE_NAME=\"ESP32-S3_Seengreat_HUB75_Matrix\"
  -D SEENGREAT_HUB75_MATRIX_S3_PINOUT
lib_deps = ${esp32s3.lib_deps}
           ${hub75.lib_deps}

; Build flags for speed, instead of optimising for size - see platformio_override.sample.ini
[Speed_Flags]
build_unflags = -Os ;; disable standard optimization for small size
build_flags =
  -O2 ;; optimize for speed
  -free -fipa-pta ;; very useful, too
  # Important: we need to explicitly switch off some "-O2" optimizations
  -fno-jump-tables -fno-tree-switch-conversion                 ;; needed - firmware may crash otherwise
  -freorder-blocks -Wwrite-strings -fstrict-volatile-bitfields ;; needed - recommended by espressif

